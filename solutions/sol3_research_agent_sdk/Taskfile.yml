# Standalone. No dependency on the root Taskfile. Every command runs from this
# folder, start to finish.
#
# `task test`, `task table`, and `task checks` need no SDK, no API key, and no
# network. `task demo` needs the renderer. `task run` and `task publish` need a
# key, and `task publish` also needs `gh` with the `gist` scope. `task setup`
# creates `.venv` in this folder so Homebrew Python (PEP 668) is not in the way.
version: '3'

# Task loads these for every task below. The closest dotenv file wins, so an
# attendee may put a key in this folder, `solutions/`, the repo root, or the
# directory above the checkout. Missing files are fine.
dotenv: ['.env', '../.env', '../../.env', '../../../.env']

vars:
  # TASKFILE_DIR is Task's own absolute path to this file's directory. Every
  # path below is built from it on purpose. A relative path depends on the
  # invoking process's cwd being exactly right, and when it is not, this port
  # can end up writing a paper into a different checkout.
  PY: '{{.PY | default "python3"}}'
  VENV: '{{.TASKFILE_DIR}}/.venv'
  RUN_PY: '{{.RUN_PY | default (printf "%s/bin/python" .VENV)}}'
  TOPIC: '{{.TOPIC | default "loop engineering exit criteria"}}'
  RENDERER: 'https://github.com/SpillwaveSolutions/imagen-diagrams'
  RENDERER_TAG: 'v0.1.0'

tasks:
  default:
    cmds: [task --list]

  # -- no SDK, no key, no network -------------------------------------------

  test:
    desc: Unit tests for this folder. No SDK, no API key, no network.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ -x "{{.RUN_PY}}" ]; then
          "{{.RUN_PY}}" -m pytest tests -q
        else
          {{.PY}} -m pytest tests -q
        fi

  table:
    desc: Print the role table and exit, with no SDK installed.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} loop.py --table-only'

  checks:
    desc: Run the deterministic modules against their own assertions.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} checks.py --demo'
      - '{{.PY}} gates.py --demo'
      - '{{.PY}} publish.py --demo'
      - '{{.PY}} rkc.py --demo'

  # -- setup ----------------------------------------------------------------

  setup:
    desc: Create .venv in this folder, install the Agent SDK, clone the renderer.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - test -x {{.RUN_PY}} || {{.PY}} -m venv {{.VENV}}
      - '{{.RUN_PY}} -m pip install --quiet claude-agent-sdk pytest'
      - task: renderer

  renderer:
    desc: Clone imagen-diagrams at a pinned tag. Skips if it is already there.
    dir: '{{.TASKFILE_DIR}}'
    status:
      - test -d .cache/imagen-diagrams/.git
    cmds:
      - mkdir -p .cache
      - git clone --quiet --depth 1 --branch {{.RENDERER_TAG}} {{.RENDERER}} .cache/imagen-diagrams

  # -- the loop -------------------------------------------------------------

  demo:
    desc: A full offline run over the recorded fixture. No key, no network.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ -x "{{.RUN_PY}}" ]; then
          "{{.RUN_PY}}" loop.py --topic "{{.TOPIC}}" --backend fixture --fresh
        else
          {{.PY}} loop.py --topic "{{.TOPIC}}" --backend fixture --fresh
        fi

  e2e-fixture:
    desc: Build and validate the illustrated loop-engineering paper from recorded research.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ ! -x "{{.RUN_PY}}" ]; then
          echo "run task setup first. It creates .venv and installs the renderer."
          exit 1
        fi
        "{{.RUN_PY}}" e2e.py --mode fixture

  e2e-live:
    desc: Run the bounded live Agent SDK acceptance test. Needs ANTHROPIC_API_KEY and PERPLEXITY_API_KEY.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ ! -x "{{.RUN_PY}}" ]; then
          echo "run task setup first. It creates .venv and installs the renderer."
          exit 1
        fi
        "{{.RUN_PY}}" e2e.py --mode live --max-usd "{{.LIVE_E2E_MAX_USD | default "10"}}"

  run:
    desc: Research a topic and write the paper. Needs a key. TOPIC=... to set it.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ ! -x "{{.RUN_PY}}" ]; then
          echo "run task setup first. It creates .venv in this folder and installs claude-agent-sdk."
          exit 1
        fi
        "{{.RUN_PY}}" loop.py --topic "{{.TOPIC}}" {{.CLI_ARGS}}

  publish:
    desc: Run, then push the paper and its figures to a private gist.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ ! -x "{{.RUN_PY}}" ]; then
          echo "run task setup first. It creates .venv in this folder and installs claude-agent-sdk."
          exit 1
        fi
        "{{.RUN_PY}}" loop.py --topic "{{.TOPIC}}" --publish {{.CLI_ARGS}}

  clean:
    desc: Delete every run under work/. The renderer clone in .cache/ stays.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - rm -rf work
