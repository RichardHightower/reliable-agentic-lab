# Copy onto the Droplet as /etc/nginx/sites-available/agent-webhook
# Then: ln -s /etc/nginx/sites-available/agent-webhook /etc/nginx/sites-enabled/agent-webhook
#        nginx -t && systemctl reload nginx
#        certbot --nginx -d YOUR_DOMAIN
#
# Replace YOUR_DOMAIN before certbot. The unit binds 127.0.0.1:8000 only.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 1m;

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location /github-webhook {
        proxy_pass http://127.0.0.1:8000/github-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
