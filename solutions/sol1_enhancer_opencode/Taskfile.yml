# Standalone. No dependency on the root Taskfile. Every command here runs
# from this folder, start to finish: clone your fork, seed test tickets, run
# a poll.
version: '3'

vars:
  # TASKFILE_DIR is Task's own absolute path to this file's directory. Every
  # path below is built from it, on purpose: a relative path here depends on
  # the invoking process's cwd being exactly right, and when it is not, this
  # plugin can end up reading and writing a different checkout entirely, one
  # that happens to also have a work/northwind-field-crm.
  TARGET: '{{.TARGET | default (printf "%s/../../work/northwind-field-crm" .TASKFILE_DIR)}}'

tasks:
  default:
    cmds: [task --list]

  clone:
    desc: Clone your fork (from config.json) into work/. Skips if it is already there.
    status:
      - test -d {{.TARGET}}/.git
    cmds:
      - test -f {{.TASKFILE_DIR}}/config.json || (echo "copy config.json.example to config.json first, and fill in your GitHub username" && exit 1)
      - mkdir -p {{.TASKFILE_DIR}}/../../work
      - git clone --quiet https://github.com/$(jq -r .fork_owner {{.TASKFILE_DIR}}/config.json)/$(jq -r .repo_name {{.TASKFILE_DIR}}/config.json).git {{.TARGET}}

  create-test-tickets:
    desc: Create GitHub issues for every draft ticket. task run never opens issues.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/setup_test_tickets.sh {{.TARGET}}

  run:
    desc: One poll-and-act step over every open ticket, using this plugin.
    # Pinning dir here, not just TARGET, means the opencode run subprocess
    # always starts from this exact folder. SKILL.md reads ./config.json
    # from its cwd, and OpenCode finds .opencode/ by probing ancestors of
    # its cwd, so both depend on this line.
    dir: '{{.TASKFILE_DIR}}'
    # --command enhancer-loop is the headless flag. The message after -- is
    # substituted into $ARGUMENTS in .opencode/command/enhancer-loop.md.
    # --auto approves asks that are not explicitly denied (the judge and
    # doer still have edit: deny).
    # --dir is also passed to opencode so a Task invocation from elsewhere
    # cannot start OpenCode in the wrong tree.
    # < /dev/null, because some CLIs append open stdin to the prompt and
    # wait for EOF. Task pipes stdin. Without this the process can hang
    # with no output and no error.
    cmds:
      - >-
        opencode run
        --dir {{.TASKFILE_DIR}}
        --auto
        --command enhancer-loop
        --
        --repo {{.TARGET}} {{.CLI_ARGS}}
        < /dev/null

  poll-forever:
    desc: Poll forever until killed (Ctrl-C). Seminar-only stand-in for a real scheduler, see SPEC.md.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/poll_forever.sh {{.CLI_ARGS}}
