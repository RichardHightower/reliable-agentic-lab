# Standalone. No dependency on the root Taskfile. Every command runs from this
# folder, start to finish: clone your fork, seed test tickets, run a poll.
#
# The live test is the same three commands as sol1_enhancer, sol1_enhancer_opencode,
# and sol1_enhancer_grok_build:
#
#   task reset-test-tickets
#   task create-test-tickets
#   task run --
#
# `task test`, `task table`, and `task checks` need no SDK, no API key, and no
# clone. `task run` and `task poll-forever` need all three.
version: '3'

vars:
  # TASKFILE_DIR is Task's own absolute path to this file's directory. Every
  # path below is built from it on purpose. A relative path depends on the
  # invoking process's cwd being exactly right, and when it is not, this port
  # can end up polling a different checkout that also has a work/ directory.
  TARGET: '{{.TARGET | default (printf "%s/../../work/northwind-field-crm" .TASKFILE_DIR)}}'
  PY: '{{.PY | default "python3"}}'

tasks:
  default:
    cmds: [task --list]

  # -- no SDK, no key, no clone ---------------------------------------------

  test:
    desc: Unit tests for this folder. No SDK and no API key.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} -m pytest tests -q'

  table:
    desc: Print the role table and exit, with no SDK installed.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} loop.py --table-only'

  checks:
    desc: Run the two deterministic check scripts against their own assertions.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} check_fields.py --demo'
      - '{{.PY}} check_stop.py --demo'

  # -- setup ----------------------------------------------------------------

  setup:
    desc: Install the Agent SDK and pytest into the repo venv.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} -m pip install --quiet claude-agent-sdk pytest'

  clone:
    desc: Clone your fork (from config.json) into work/. Skips if it is already there.
    status:
      - test -d {{.TARGET}}/.git
    cmds:
      - test -f {{.TASKFILE_DIR}}/config.json || (echo "copy config.json.example to config.json first, and fill in your GitHub username" && exit 1)
      - mkdir -p {{.TASKFILE_DIR}}/../../work
      - git clone --quiet https://github.com/$(jq -r .fork_owner {{.TASKFILE_DIR}}/config.json)/$(jq -r .repo_name {{.TASKFILE_DIR}}/config.json).git {{.TARGET}}

  create-test-tickets:
    desc: Create GitHub issues for every draft ticket. task run never opens issues.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/setup_test_tickets.sh {{.TARGET}}

  reset-test-tickets:
    desc: Close and rename GitHub test issues so create-test-tickets makes new ones.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/reset_test_tickets.sh {{.TARGET}}

  # -- the loop. Needs the SDK, a key, and a clone ---------------------------

  run:
    desc: One poll-and-act step over every open ticket.
    # Pinning dir here, not just TARGET, means loop.py always starts from this
    # exact folder. config.json is read from Path(__file__), so that is already
    # pinned; the subprocess cwd still has to be this folder so relative paths
    # in CLI_ARGS and the plugin/ tree resolve the same way as the other ports.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} loop.py --once --repo {{.TARGET}} {{.CLI_ARGS}}'

  poll-forever:
    desc: Poll forever until killed (Ctrl-C). Seminar-only stand-in for a scheduler.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/poll_forever.sh {{.CLI_ARGS}}
