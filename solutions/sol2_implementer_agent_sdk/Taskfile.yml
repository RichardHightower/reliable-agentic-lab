# Standalone. No dependency on the root Taskfile.
#
# `task test` and `task table` need no SDK, no API key, and no clone.
# `task run -- --doer sdk` drives tickets and needs the SDK. `task setup`
# creates `.venv` in this folder so Homebrew Python (PEP 668) is not in the way.
version: '3'

dotenv: ['../../.env', '.env']

vars:
  TARGET: '{{.TARGET | default (printf "%s/../../work/northwind-field-crm" .TASKFILE_DIR)}}'
  VENV: '{{.TASKFILE_DIR}}/.venv'
  PY: '{{.PY | default "python3"}}'
  RUN_PY: '{{.RUN_PY | default (printf "%s/bin/python" .VENV)}}'

tasks:
  default:
    cmds: [task --list]

  test:
    desc: Unit tests for this folder. No SDK, no API key, no clone.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ -x "{{.RUN_PY}}" ]; then
          "{{.RUN_PY}}" -m pytest tests -q
        else
          {{.PY}} -m pytest tests -q
        fi

  e2e:
    desc: Offline loop tests. No SDK, no key, no public CRM clone.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if [ -x "{{.RUN_PY}}" ]; then
          "{{.RUN_PY}}" -m pytest tests/test_implementer.py tests/test_adapter.py -q
        else
          {{.PY}} -m pytest tests/test_implementer.py tests/test_adapter.py -q
        fi

  table:
    desc: Print the role table and stop, with no SDK installed.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.PY}} harness.py --table-only'

  setup:
    desc: Create .venv in this folder and install the Agent SDK into it.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - test -x {{.RUN_PY}} || {{.PY}} -m venv {{.VENV}}
      - '{{.RUN_PY}} -m pip install --quiet claude-agent-sdk pytest'

  clone:
    desc: Clone northwind-field-crm into work/. Skips if it is already there.
    status:
      - test -d {{.TARGET}}/.git
    cmds:
      - mkdir -p {{.TASKFILE_DIR}}/../../work
      - git clone --quiet https://github.com/RichardHightower/northwind-field-crm.git {{.TARGET}}

  run:
    desc: Implementer loop against TARGET. Pass --doer sdk to use the Agent SDK.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        args=" {{.CLI_ARGS}} "
        if echo "$args" | grep -q -- " --doer sdk"; then
          if [ ! -x "{{.RUN_PY}}" ]; then
            echo "run task setup first. --doer sdk needs claude-agent-sdk in .venv."
            exit 1
          fi
          "{{.RUN_PY}}" harness.py --repo {{.TARGET}} {{.CLI_ARGS}}
        elif [ -x "{{.RUN_PY}}" ]; then
          "{{.RUN_PY}}" harness.py --repo {{.TARGET}} {{.CLI_ARGS}}
        else
          {{.PY}} harness.py --repo {{.TARGET}} {{.CLI_ARGS}}
        fi
