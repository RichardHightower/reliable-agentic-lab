version: '3'

dotenv: ['../../.env', '.env']

tasks:
  default:
    cmds: [task --list]

  test:
    desc: Unit tests. No Deep Agents package and no CRM clone.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 -m pytest tests -q

  table:
    desc: Print the role table.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 harness.py --table-only

  run:
    desc: Implementer loop. Pass --doer deep to use Deep Agents.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 harness.py {{.CLI_ARGS}}
