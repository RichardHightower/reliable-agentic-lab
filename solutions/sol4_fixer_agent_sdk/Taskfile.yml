version: '3'

dotenv: ['../../.env', '.env']

tasks:
  default:
    cmds: [task --list]

  test:
    desc: Unit tests. No Agent SDK and no CRM clone.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 -m pytest tests -q

  table:
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 loop.py --table-only

  run:
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 loop.py {{.CLI_ARGS}}
