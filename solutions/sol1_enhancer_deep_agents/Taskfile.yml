# Standalone. No dependency on the root Taskfile. Needs no SDK installed:
# --table-only prints the role table and stops.
version: '3'

tasks:
  default:
    cmds: [task --list]

  test:
    desc: Print the role table and exit, with no SDK installed.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 loop.py --table-only
