# Standalone. No dependency on the root Taskfile. Every command here runs
# from this folder, start to finish: clone your fork, seed test tickets, run
# a poll.
version: '3'

vars:
  # TASKFILE_DIR is Task's own absolute path to this file's directory. Every
  # path below is built from it, on purpose: a relative path here depends on
  # the invoking process's cwd being exactly right, and when it is not, this
  # plugin can end up reading and writing a different checkout entirely, one
  # that happens to also have a work/northwind-field-crm.
  TARGET: '{{.TARGET | default (printf "%s/../../work/northwind-field-crm" .TASKFILE_DIR)}}'
  # Codex writes session state under CODEX_HOME while it runs. The
  # orchestrator shells out to `bin/role.sh`, which starts a second Codex
  # process, and that child cannot start unless this directory is writable
  # from inside the parent's sandbox. Without it the child dies in under a
  # second with "failed to initialize in-process app-server client".
  CODEX_HOME_DIR: '{{.CODEX_HOME | default (printf "%s/.codex" (env "HOME"))}}'

tasks:
  default:
    cmds: [task --list]

  clone:
    desc: Clone your fork (from config.json) into work/. Skips if it is already there.
    status:
      - test -d {{.TARGET}}/.git
    cmds:
      - test -f {{.TASKFILE_DIR}}/config.json || (echo "copy config.json.example to config.json first, and fill in your GitHub username" && exit 1)
      - mkdir -p {{.TASKFILE_DIR}}/../../work
      - git clone --quiet https://github.com/$(jq -r .fork_owner {{.TASKFILE_DIR}}/config.json)/$(jq -r .repo_name {{.TASKFILE_DIR}}/config.json).git {{.TARGET}}

  test:
    desc: Run the standalone deterministic rubric checks.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 .agents/skills/enhancer-loop/scripts/check_fields.py --demo
      - bash -n bin/role.sh
      - tests/test_role_output.sh

  checks:
    desc: Run the demo's deterministic checks before a live poll.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task test

  create-test-tickets:
    desc: Create GitHub issues for every draft ticket. task run never opens issues.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/setup_test_tickets.sh {{.TARGET}}

  reset-test-tickets:
    desc: Close and rename GitHub test issues so create-test-tickets makes new ones.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/reset_test_tickets.sh {{.TARGET}}

  fence-check:
    desc: Confirm the orchestrator sandbox is real. Run this once, before you trust a demo.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/fence_check.sh

  run:
    desc: One poll-and-act step over every open ticket, using this plugin.
    # Pinning dir here, not just TARGET, means the codex exec subprocess
    # always starts from this exact folder. SKILL.md reads ./config.json from
    # its cwd, and Codex finds .agents/skills by probing ancestors of its cwd,
    # so both depend on this line.
    dir: '{{.TASKFILE_DIR}}'
    # The backslash before $enhancer-loop is load-bearing. Unescaped, the
    # shell expands $enhancer to nothing and the skill never resolves. Single
    # quotes would escape it too, but CLI_ARGS arrives already quoted by Task,
    # and its quotes then terminate the prompt early.
    #
    # -s workspace-write, because the orchestrator edits the ticket file.
    # network_access, because workspace-write turns the network off by
    # default and every step here calls `gh`.
    # --add-dir on the target repo, because it sits outside this folder and
    # workspace-write only writes inside the workspace.
    # < /dev/null, because `codex exec` appends open stdin to the prompt and
    # waits for EOF. Task pipes stdin, so without this the process hangs with
    # no output and no error.
    cmds:
      - >-
        codex exec
        -s workspace-write
        -c sandbox_workspace_write.network_access=true
        --add-dir {{.TARGET}}
        --add-dir {{.CODEX_HOME_DIR}}
        "\$enhancer-loop --repo {{.TARGET}} {{.CLI_ARGS}}"
        < /dev/null

  poll-forever:
    desc: Poll forever until killed (Ctrl-C). Seminar-only stand-in for a real scheduler, see SPEC.md.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bin/poll_forever.sh {{.CLI_ARGS}}
