name: unattended-fixer

# Module 4. The fixer in solutions/sol4_fixer, triggered when nobody is watching.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: the target branch to repair
        default: broken-pr
        type: string
  pull_request:
  schedule:
    - cron: "0 15 * * 1-5"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Task
        run: |
          sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          task --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clone and set up the target repo
        run: |
          git clone --quiet https://github.com/RichardHightower/northwind-field-crm.git \
            work/northwind-field-crm
          cd work/northwind-field-crm && task setup

      - name: Run the fixer with nobody watching
        working-directory: solutions/sol4_fixer
        run: |
          git -C ../../work/northwind-field-crm checkout ${{ github.event.inputs.branch || 'broken-pr' }}
          python fixer.py \
            --repo ../../work/northwind-field-crm \
            --doer reference

      - name: Upload the state and the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unattended-state
          path: |
            work/northwind-field-crm/.harness/state.json
            work/northwind-field-crm/.harness/receipt.json
            work/northwind-field-crm/reports/
