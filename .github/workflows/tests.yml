name: tests

on: [push, pull_request]

# The worklog invariants ran on every push and nothing else did, so no test in
# this repo had ever run in continuous integration. A cost-cap test that only
# passed because the runner happened to have plantuml installed is what that
# gap looks like from the inside.
#
# The runner is bare on purpose: no mermaid-cli, no plantuml, no Java, no
# imagen, no API key, no SDK. A solution folder that needs any of those to make
# its tests pass is not standalone, which is the one property every folder here
# is supposed to have.

jobs:
  folders:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Paired by lab, both runtimes adjacent, because a missing twin is the
      # failure this list is recovering from. Three Agent SDK ports were absent
      # while their Deep Agents twins were covered, so nobody noticed that
      # sol2's write separation had stopped holding or that sol4's money gate
      # could not fire. A gap you can see is a gap that gets closed.
      #
      # `solutions/extra_credit` is deliberately not here. It needs fastapi and
      # the rest of the root requirements, and this job installs pytest only.
      # The root `task test` covers it.
      matrix:
        folder:
          - solutions/sol1_enhancer_agent_sdk
          - solutions/sol1_enhancer_deep_agents
          - solutions/sol2_implementer_agent_sdk
          - solutions/sol2_implementer_deep_agents
          - solutions/sol3_research_agent_sdk
          - solutions/sol3_research_deep_agents
          - solutions/sol4_fixer_agent_sdk
          - solutions/sol4_fixer_deep_agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install pytest only
        run: python -m pip install --quiet pytest
      # Each folder's own suite runs its check scripts and its role table, so
      # this job stays one step and adding a folder stays one matrix line. A
      # step naming a file only one folder has fails every folder without it.
      - name: the folder's own tests
        working-directory: ${{ matrix.folder }}
        run: python -m pytest tests -q
