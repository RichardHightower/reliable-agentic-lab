# Standalone. No dependency on the root Taskfile. This folder holds a
# harness.py library (no CLI to run), so the only task is a self-check.
version: '3'

tasks:
  default:
    cmds: [task --list]

  test:
    desc: Confirm red_gate, score_attempt, and run_loop import cleanly.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 -c "import harness; print('ok')"
