# Standalone. No dependency on the root Taskfile. This folder holds a
# loop.py library (no CLI to run), so the only task is a self-check.
version: '3'

tasks:
  default:
    cmds: [task --list]

  test:
    desc: Confirm plan_questions and check_brief import without error.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 -c "import loop; print('ok')"
