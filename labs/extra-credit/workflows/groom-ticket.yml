# Extra credit. Copy this file onto YOUR FORK as .github/workflows/groom-ticket.yml
# Do not enable it on the shared instructor repo.
name: Groom New Ticket

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to groom
        required: true

concurrency:
  group: extra-credit-groom-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  groom:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent-in-progress') &&
        !contains(join(github.event.issue.labels.*.name, ','), 'ready')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ticket groomer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          AGENT_MAX_ATTEMPTS: "3"
        run: |
          python solutions/extra_credit/groom_ticket.py --issue "$ISSUE_NUMBER" --github
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-groom
          path: solutions/extra_credit/work/last-groom.json
