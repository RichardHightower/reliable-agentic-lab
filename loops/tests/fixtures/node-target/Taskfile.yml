# Same contract as the Python target. Different language entirely.
# The loop engine does not know or care which one it is driving.
version: '3'
tasks:
  setup:
    cmds: [node --version]
  test:
    cmds:
      - mkdir -p reports
      - node --test --test-reporter=junit --test-reporter-destination=reports/junit.xml "test/*.test.js"
      - node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=reports/cov.txt "test/*.test.js"
      - node scripts-cov.mjs
  e2e:
    cmds:
      - mkdir -p reports
      - 'printf ''<?xml version="1.0"?><testsuites><testsuite name="e2e" tests="0" failures="0" errors="0" skipped="0"/></testsuites>'' > reports/junit-e2e.xml'
  lint:
    cmds: [node --check src/calc.js]
  format-check:
    cmds: ['node -e "process.exit(0)"']
